[project]
name = "fd-paper-trading"
version = "0.1.0"
description = "Multi-tenant paper-trading service with simulated fills"
readme = "README.md"
license = "MIT"
authors = [
    { name = "shichengsi", email = "1253774197@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.31",
    "fastmcp>=3.4,<4",
    # Library import of the open-data ontology (read_range bulk series API is
    # required by the fd-open-data market-data provider).
    #
    # The [data] extra is NOT optional here: the coverage judgment probes
    # upstream to tell a market closure from a data hole, and a probe with no
    # fetcher installed fails as "could not ask" — which correctly stays
    # missing, so every window spanning a holiday is rejected forever. The
    # provider needs at least one real source to answer.
    "fd-open-data-mcp[data]>=0.5.40",
]

[project.scripts]
fd-paper-trading = "fd_paper_trading.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = []

[tool.uv]
package = true

# 镜像层的非 .py 文件必须**显式**声明，不靠 VCS 追踪。
#
# 实测过的失败形态（fd-open-data-mcp）：setuptools 的 include-package-data 默认只收
# **被 git 追踪**的文件，于是新建但未提交的 declarations.yaml 被静默丢出 wheel——
# 本机 editable 安装读源码树完全看不出，装到干净环境才 FileNotFoundError。
# 这里把 _vendor 下的 schema / 契约钉成显式声明，让"文件在不在仓库里"不影响
# "文件在不在包里"。VENDOR.json 与 README 只是为了镜像自解释，一并带上。
[tool.setuptools.package-data]
"fd_paper_trading._vendor" = ["VENDOR.json", "README.md"]
"fd_paper_trading._vendor.schemas" = ["*.schema.json"]
