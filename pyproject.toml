[project]
name = "fd-trade"
version = "0.1.0"
description = "Multi-tenant stock paper-trading service built on Nautilus Trader"
readme = "README.md"
authors = [
    { name = "shichengsi", email = "1253774197@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "nautilus_trader>=1.200.0",
    "requests>=2.31",
    "fastmcp>=2.5.3",
]

[project.scripts]
fd-trade = "fd_trade.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Nautilus's BacktestEngine.run() calls pandas Timestamp.utcnow() internally;
    # not patchable upstream. Match the exact message so other deprecations still show.
    "ignore:Timestamp.utcnow is deprecated",
]

[tool.uv]
package = true
