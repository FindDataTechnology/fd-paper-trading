[project]
name = "fd-paper-trading"
version = "0.1.0"
description = "Multi-tenant paper-trading service with simulated fills"
readme = "README.md"
license = "MIT"
authors = [
    { name = "shichengsi", email = "1253774197@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.31",
    "fastmcp>=2.5.3",
    # Library import of the open-data ontology (read_range bulk series API is
    # required by the fd-open-data market-data provider).
    "fd-open-data-mcp>=0.4.4",
]

[project.scripts]
fd-paper-trading = "fd_paper_trading.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = []

[tool.uv]
package = true
